; PlatformIO project configuration — Car Control Pro (ESP32-S3)
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3
; PlatformIO only auto-detects *.ino directly inside src_dir, so point it at
; the sketch folder (the folder name also matches the .ino name, which the
; Arduino IDE requires).
src_dir = src/Car_Control_Pro_ESP32S3

[env:esp32s3]
platform = espressif32@^6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; OTA needs two app slots (app0/app1) -> default partition table
board_build.partitions = default.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

; ElegantOTA spans several architectures; strict mode avoids resolving
; dependencies for chips we never build for.
lib_compat_mode = strict
lib_ldf_mode = deep+

lib_deps =
    ayushsharma82/ElegantOTA@^3.1.7
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@^1.4.3

build_flags =
    -Wall
    -Wextra
    ; Uncomment to enable the API key / OTA basic-auth guards (see docs/API.md)
    ; -DAPI_PIN=\"1234\"
    ; -DOTA_AUTH_USER=\"admin\"
    ; -DOTA_AUTH_PASS=\"change-me\"

; --- Optional: unit-test / lint friendly defaults -----------------------------
[env:esp32s3-lint]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -Werror
